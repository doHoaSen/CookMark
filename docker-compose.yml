services:
  cookmark-db:
    image: postgres:16-alpine
    container_name: cookmark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookmark}
      POSTGRES_USER: ${POSTGRES_USER:-cookmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookmark_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cookmark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cookmark-postgres-data:
